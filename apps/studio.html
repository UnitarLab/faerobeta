<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio · Faero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&family=Press+Start+2P&family=VT323&family=Pacifico&family=Bungee&family=Comic+Neue:wght@700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* Studio — a small paint program for statuses.
   Same glossy sky-blue as the rest of Faero; the canvas is the only
   thing allowed to be loud. */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky:#EAF6FF;--sky2:#D3ECFF;--line:rgba(120,180,230,.55);--ink:#0B2545;--ink2:#3C5A7D;--ink3:#7393B3;
  --blue:#1E88E5;--blue2:#1565C0;--paper:#fff;--pane:rgba(255,255,255,.72);
  --glossy:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(214,238,255,.7) 50%,rgba(190,226,255,.55) 51%,rgba(235,247,255,.85) 100%);
  --pri:linear-gradient(180deg,#4FB0F6 0%,#1E88E5 48%,#1565C0 52%,#1976D2 100%);
}
html,body{height:100%}
body{font-family:'Exo 2',system-ui,sans-serif;color:var(--ink);background:
  radial-gradient(1200px 500px at 10% -10%,#fff 0,rgba(255,255,255,0) 60%),
  linear-gradient(180deg,#CFEAFF 0%,#EAF6FF 45%,#DDF3E4 100%);overflow:hidden;display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── top bar ── */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(220,240,255,.75));box-shadow:0 2px 10px rgba(21,101,192,.08);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;letter-spacing:.2px;padding-right:6px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:15px;
  background:linear-gradient(160deg,#FFE082,#FB8C00);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 6px rgba(251,140,0,.35)}
.sep{width:1px;height:24px;background:var(--line);flex-shrink:0}
.gb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:11px;white-space:nowrap;
  border:1px solid var(--line);background:var(--glossy);font-size:12px;font-weight:700;color:var(--blue2);
  box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(21,101,192,.12);transition:filter .15s,transform .1s}
.gb:hover{filter:brightness(1.04)}
.gb:active{transform:translateY(1px)}
.gb:disabled{opacity:.45;cursor:default}
.gb.pri{color:#fff;border-color:rgba(160,215,255,.9);background:var(--pri);text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 10px rgba(21,101,192,.3)}
.gb.ic{width:32px;padding:0}
.gb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top select{height:32px;border-radius:11px;border:1px solid var(--line);background:var(--glossy);padding:0 8px;font-size:12px;font-weight:700;color:var(--blue2)}
.grow{flex:1}

/* ── body ── */
.main{flex:1;display:grid;grid-template-columns:58px 1fr 300px;min-height:0}
.tools{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-right:1px solid var(--line);background:var(--pane);overflow-y:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tl{width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--ink2);position:relative;flex-shrink:0}
.tl svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tl:hover{background:rgba(30,136,229,.08)}
.tl.on{color:#fff;background:var(--pri);border-color:rgba(160,215,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 8px rgba(21,101,192,.3)}
.tl kbd{position:absolute;right:2px;bottom:1px;font:700 8px 'Exo 2';opacity:.5}
.tsep{width:28px;height:1px;background:var(--line);margin:4px 0;flex-shrink:0}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.15);position:relative;overflow:hidden;flex-shrink:0}
.swatch input{position:absolute;inset:-8px;width:60px;height:60px;opacity:0;cursor:pointer}

.stagew{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.optbar{display:flex;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.55);font-size:11.5px;font-weight:700;color:var(--ink2);min-height:42px;flex-wrap:wrap}
.optbar label{display:flex;align-items:center;gap:7px}
.optbar input[type=range]{width:110px;accent-color:var(--blue)}
.optbar .val{min-width:28px;color:var(--blue2)}
.pal{display:flex;gap:3px;flex-wrap:wrap}
.pal button{width:17px;height:17px;border-radius:5px;border:1px solid rgba(0,0,0,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.pal button.on{outline:2px solid var(--blue);outline-offset:1px}
.chk{display:flex;align-items:center;gap:5px}
.stage{flex:1;position:relative;display:grid;place-items:center;padding:18px;min-height:0;min-width:0;overflow:hidden;
  background:repeating-conic-gradient(rgba(120,170,220,.10) 0 25%,transparent 0 50%) 0 0/22px 22px}
.stage canvas{display:block;border-radius:6px;box-shadow:0 0 0 1px rgba(21,101,192,.18),0 14px 40px rgba(13,71,161,.22);
  background:repeating-conic-gradient(#e9eef3 0 25%,#fff 0 50%) 0 0/24px 24px;touch-action:none}
.stage canvas.c-move{cursor:default}.stage canvas.c-draw{cursor:crosshair}.stage canvas.c-text{cursor:text}.stage canvas.c-grab{cursor:grab}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(11,37,69,.78);color:#fff;font-size:11.5px;font-weight:600;
  pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
.hint.show{opacity:1}

/* ── side panel ── */
.side{border-left:1px solid var(--line);background:var(--pane);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tab{flex:1;height:30px;border-radius:10px;border:1px solid transparent;background:none;font-size:12px;font-weight:800;color:var(--ink3)}
.tab.on{background:var(--glossy);border-color:var(--line);color:var(--blue2);box-shadow:inset 0 1px 0 #fff}
.pane{display:none;flex:1;overflow-y:auto;padding:10px 12px 16px;min-height:0}
.pane.on{display:block}
.h{font-size:10px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3);margin:12px 0 7px;display:flex;align-items:center;gap:7px}
.h::before{content:"";width:6px;height:6px;border-radius:50%;background:#64B5F6}
.h:first-child{margin-top:2px}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{aspect-ratio:4/5;border-radius:12px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line),0 4px 10px rgba(21,101,192,.12);
  display:flex;flex-direction:column;justify-content:flex-end;padding:8px;text-align:left;color:#fff;font-weight:800;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.35);position:relative;overflow:hidden}
.tpl small{display:block;font-weight:600;font-size:10px;opacity:.9}
.tpl:hover{transform:translateY(-1px)}
.tpl b{position:absolute;top:8px;left:8px;font-size:22px;text-shadow:none}
.bgs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.bgs button{aspect-ratio:1;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.bgs button.on{box-shadow:0 0 0 2px var(--blue)}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sizes button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--glossy);font-size:10.5px;font-weight:800;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.sizes button i{display:block;border:2px solid currentColor;border-radius:2px}
.sizes button.on{color:var(--blue2);border-color:var(--blue)}
.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex-shrink:0;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--glossy);font-size:11.5px;font-weight:800;color:var(--ink2)}
.chip.on{background:var(--pri);color:#fff;border-color:rgba(160,215,255,.9);text-shadow:0 1px 1px rgba(0,0,0,.2)}
.gifs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.gifs button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:repeating-conic-gradient(#eef4fa 0 25%,#fff 0 50%) 0 0/12px 12px;display:grid;place-items:center;padding:6px;overflow:hidden}
.gifs button:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(21,101,192,.18)}
.gifs img{max-width:100%;max-height:100%;image-rendering:pixelated}
.src{font-size:10.5px;color:var(--ink3);margin-top:10px;line-height:1.4}
.src a{color:var(--blue2)}
.layers{display:flex;flex-direction:column;gap:5px}
.ly{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.75);font-size:12px;font-weight:700}
.ly.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset;background:#fff}
.ly .th{width:34px;height:34px;border-radius:7px;flex-shrink:0;background:repeating-conic-gradient(#eef4fa 0 25%,#fff 0 50%) 0 0/10px 10px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.ly .th canvas{max-width:100%;max-height:100%}
.ly .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ly button{width:24px;height:24px;border-radius:7px;border:0;background:none;color:var(--ink3);display:grid;place-items:center}
.ly button:hover{background:rgba(30,136,229,.1);color:var(--blue2)}
.ly button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ly.hid .nm,.ly.hid .th{opacity:.4}
.props{margin-top:6px;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.8)}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:11.5px;font-weight:700;color:var(--ink2)}
.row>span:first-child{width:72px;flex-shrink:0}
.row input[type=range]{flex:1;accent-color:var(--blue)}
.row select,.row input[type=color]{flex:1;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;padding:0 6px;font-size:12px}
.row input[type=color]{padding:2px}
textarea.txt{width:100%;min-height:64px;border-radius:10px;border:1px solid var(--line);padding:8px 10px;font-size:14px;font-weight:700;resize:vertical;background:#fff;-webkit-user-select:text;user-select:text}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.styles button{height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:900;font-size:15px}
.styles button.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.filters button{height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:10.5px;font-weight:800;color:var(--ink2)}
.filters button.on{border-color:var(--blue);color:var(--blue2);box-shadow:0 0 0 1px var(--blue) inset}
.empty{font-size:12px;color:var(--ink3);padding:10px 2px;line-height:1.45}

/* ── export sheet ── */
.scrim{position:fixed;inset:0;background:rgba(11,37,69,.35);display:none;place-items:center;z-index:20;padding:16px}
.scrim.on{display:grid}
.sheet{width:min(420px,100%);background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(13,71,161,.35);overflow:hidden}
.sheet h3{padding:12px 16px;font-size:13px;font-weight:900;background:var(--glossy);border-bottom:1px solid var(--line)}
.sheet .bd{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sheet .prev{display:grid;place-items:center;min-height:160px;border-radius:12px;background:repeating-conic-gradient(#eef4fa 0 25%,#fff 0 50%) 0 0/16px 16px}
.sheet .prev img{max-width:100%;max-height:260px;border-radius:6px}
.sheet p{font-size:12px;color:var(--ink2);line-height:1.45}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--sky2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .1s}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-10px);padding:8px 14px;border-radius:12px;background:rgba(11,37,69,.88);color:#fff;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:30}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ── phones: tools along the bottom, panel as a sheet ── */
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto auto}
  .tools{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 8px;overflow-x:auto;order:2;justify-content:flex-start}
  .tsep{width:1px;height:28px;margin:0 4px}
  .tl kbd{display:none}
  .side{order:3;border-left:0;border-top:1px solid var(--line);max-height:40vh}
  .stage{padding:10px}
  .optbar{gap:8px;padding:6px 8px}
  .optbar input[type=range]{width:80px}
  .brand span{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><i>🎨</i><span>Studio</span></div>
  <div class="sep"></div>
  <button class="gb ic" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="gb ic" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <button class="gb" id="addPhoto" title="Add a photo or GIF from your device"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>Add image</button>
  <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" class="sr">
  <button class="gb" id="clearBtn" title="Start over">New</button>
  <div class="grow"></div>
  <button class="gb" id="dlBtn"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Save</button>
  <button class="gb pri" id="postBtn"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg>Post to Faero</button>
</header>

<div class="main">
  <nav class="tools" id="tools" aria-label="Tools">
    <button class="tl on" data-tool="move" title="Move, resize and rotate (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><kbd>V</kbd></button>
    <button class="tl" data-tool="brush" title="Brush (B)"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-8.5 8.5a3 3 0 0 1-4.2 0l-1.8-1.8a3 3 0 0 1 0-4.2z"/><path d="M4 20c1.5-.5 2.5-1.5 3-3"/></svg><kbd>B</kbd></button>
    <button class="tl" data-tool="pencil" title="Pixel pencil (P)"><svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M13 7l4 4"/></svg><kbd>P</kbd></button>
    <button class="tl" data-tool="spray" title="Spray can (A)"><svg viewBox="0 0 24 24"><rect x="7" y="9" width="8" height="12" rx="2"/><path d="M9 9V6h4v3"/><circle cx="18" cy="4" r=".6"/><circle cx="20" cy="7" r=".6"/><circle cx="17" cy="8" r=".6"/></svg><kbd>A</kbd></button>
    <button class="tl" data-tool="eraser" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="M16 3l5 5-11 11H5l-2-2z"/><path d="M10 19h11"/></svg><kbd>E</kbd></button>
    <button class="tl" data-tool="fill" title="Paint bucket (G)"><svg viewBox="0 0 24 24"><path d="M5 11l7-7 7 7-7 7z"/><path d="M19 15s2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4z"/></svg><kbd>G</kbd></button>
    <div class="tsep"></div>
    <button class="tl" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg><kbd>L</kbd></button>
    <button class="tl" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><kbd>R</kbd></button>
    <button class="tl" data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg><kbd>O</kbd></button>
    <button class="tl" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg><kbd>T</kbd></button>
    <button class="tl" data-tool="picker" title="Colour picker (I)"><svg viewBox="0 0 24 24"><path d="M14 6l4 4M4 20l2-1 9-9-2-2-9 9z"/><path d="M15 3l6 6-2 2-6-6z"/></svg><kbd>I</kbd></button>
    <div class="tsep"></div>
    <label class="swatch" id="swatch" title="Colour"><input type="color" id="color" value="#ff4fa3" aria-label="Colour"></label>
  </nav>

  <section class="stagew">
    <div class="optbar" id="optbar"></div>
    <div class="stage" id="stage">
      <canvas id="cv" width="1080" height="1350" aria-label="Your canvas"></canvas>
      <div class="hint" id="hint"></div>
    </div>
  </section>

  <aside class="side">
    <div class="tabs" role="tablist">
      <button class="tab on" data-pane="make" role="tab">Make</button>
      <button class="tab" data-pane="gifs" role="tab">GIFs</button>
      <button class="tab" data-pane="layers" role="tab">Layers</button>
    </div>
    <div class="pane on" id="p-make">
      <div class="h">Start from</div>
      <div class="tpls" id="tpls"></div>
      <div class="h">Background</div>
      <div class="bgs" id="bgs"></div>
      <div class="h">Canvas</div>
      <div class="sizes" id="sizes"></div>
    </div>
    <div class="pane" id="p-gifs">
      <div class="chips" id="gcats"></div>
      <div class="gifs" id="glist"><div class="empty">Loading GIFs…</div></div>
      <p class="src">Old-web GIFs from the GeoCities archive, via <a href="https://gifcities.org" target="_blank" rel="noopener">GifCities</a> by the Internet Archive. Tap one to drop it on the canvas.</p>
    </div>
    <div class="pane" id="p-layers">
      <div class="layers" id="layers"></div>
      <div id="props"></div>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <h3 id="sheetT">Export</h3>
    <div class="bd">
      <div class="prev" id="sprev"></div>
      <div class="bar" id="sbar" hidden><i></i></div>
      <p id="snote"></p>
      <div class="acts" id="sacts"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const inFaero = window.parent !== window;
const tell = m => { if (inFaero) parent.postMessage(m, location.origin); };
let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }
const hintEl = $('hint'); let hintT;
function hint(t) { hintEl.textContent = t; hintEl.classList.add('show'); clearTimeout(hintT); hintT = setTimeout(() => hintEl.classList.remove('show'), 1800); }
if (!inFaero) $('postBtn').hidden = true;

/* ════════════════ document ════════════════ */
const BGS = [
  { id: 'aero',   n: 'Aero sky',   stops: ['#BFE6FF', '#5AB8F5', '#1565C0'], bubbles: true },
  { id: 'grass',  n: 'Hillside',   stops: ['#9ED8FF', '#DFF4FF', '#A8E07A', '#3E9B3A'], at: [0, .55, .56, 1] },

const animated = () => D.layers.some(l => l.type === 'gif' && l.visible && l.frames.length > 1);
async function exportPng() {

  renderTo(c.getContext('2d'), D.w, D.h, performance.now() - t0, 1);
  // a PNG of a big photo can pass the 8 MB post limit; fall back to JPEG
  let b = await new Promise(r => c.toBlob(r, 'image/png'));

}
async function exportGif(onProgress) {
  gifenc = gifenc || await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm');
  const { GIFEncoder, quantize, applyPalette } = gifenc;
  const gifs = D.layers.filter(l => l.type === 'gif' && l.visible && l.frames.length > 1);
  const dur = Math.max(800, Math.min(4000, Math.max(...gifs.map(g => g.dur))));
  const step = 80;
  const n = Math.ceil(dur / step);
  // posts are at most 8 MB; a big, busy GIF gets smaller until it fits
  for (const side of [720, 560, 440, 340]) {
    const f = Math.min(1, side / Math.max(D.w, D.h)), w = Math.round(D.w * f), h = Math.round(D.h * f);

    for (let i = 0; i < n; i++) {
      renderTo(cc, w, h, i * step, f);
      const { data } = cc.getImageData(0, 0, w, h);
      const pal = quantize(data, 256, { format: 'rgb565' });
      enc.writeFrame(applyPalette(data, pal, 'rgb565'), w, h, { palette: pal, delay: step });
      onProgress((i + 1) / n);
      if (i % 3 === 2) await new Promise(r => setTimeout(r));
    }
    enc.finish();
    const blob = new Blob([enc.bytes()], { type: 'image/gif' });

}
