<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simon — faero</title>
<link rel="stylesheet" href="aero.css">
<style>
  #pads { display:grid; grid-template-columns:repeat(2,110px); grid-auto-rows:110px; gap:12px; z-index:1; }
  .pad {
    border-radius:22px 22px 26px 26px; cursor:pointer;
    border:1px solid rgba(255,255,255,0.8);
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.7), inset 0 -6px 10px rgba(10,60,30,0.35), 0 6px 18px rgba(15,80,130,0.35);
    transition: filter .08s, transform .08s;
  }
  .pad.lit { filter:brightness(2.1) saturate(1.4); transform:scale(1.05); }
  .p0 { background:linear-gradient(180deg,#7fe89a,#1e9e50); }
  .p1 { background:linear-gradient(180deg,#ff9d9d,#d0342c); }
  .p2 { background:linear-gradient(180deg,#ffe27a,#e0a010); }
  .p3 { background:linear-gradient(180deg,#8fd0f5,#1272b8); }
</style>
</head>
<body class="faero">
<script src="aero.js"></script>
<h1>SIMON</h1>
<div class="hud">
  <div class="panel"><div class="panel-label">Level</div><div class="panel-value" id="level">0</div></div>
  <div class="panel"><div class="panel-label">Best</div><div class="panel-value" id="best">0</div></div>
  <button class="btn" onclick="start()">Start</button>
</div>
<div class="bezel"><div id="pads"></div></div>
<div id="msg" class="gmsg">watch, then repeat</div>

<script>
(() => {
  const padsEl = document.getElementById('pads');
  const levelEl = document.getElementById('level'), bestEl = document.getElementById('best');
  const msg = document.getElementById('msg');
  let seq, pos, level, canPlay;
  const FREQ = [392, 330, 262, 494];

  for (let i = 0; i < 4; i++) {
    const p = document.createElement('div');
    p.className = 'pad p' + i;
    p.addEventListener('pointerdown', () => tap(i));
    padsEl.appendChild(p);
  }
  const pads = [...padsEl.children];

  let actx;
  function beep(i, dur = 320) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = FREQ[i];
      g.gain.setValueAtTime(0.18, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur/1000);
      o.connect(g).connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur/1000);
    } catch (_) {}
  }

  function lit(i, ms = 340) {
    pads[i].classList.add('lit');
    beep(i);
    setTimeout(() => pads[i].classList.remove('lit'), ms);
  }

  async function playback() {
    canPlay = false;
    msg.textContent = 'watch\u2026';
    await new Promise(r => setTimeout(r, 600));
    for (const s of seq) {
      lit(s);
      await new Promise(r => setTimeout(r, Math.max(260, 560 - level*24)));
    }
    pos = 0; canPlay = true;
    msg.textContent = 'your turn';
  }

  function start() {
    seq = []; level = 0;
    levelEl.textContent = '0';
    next();
  }

  function next() {
    level++;
    levelEl.textContent = level;
    seq.push(Math.floor(Math.random()*4));
    if (level > +bestEl.textContent) { bestEl.textContent = level; localStorage.setItem('faero-simon-best', level); }
    playback();
  }

  function tap(i) {
    if (!canPlay) return;
    lit(i, 200);
    if (i !== seq[pos]) {
      canPlay = false;
      msg.textContent = 'wrong! reached level ' + level;
      return;
    }
    pos++;
    if (pos === seq.length) { canPlay = false; msg.textContent = 'nice'; setTimeout(next, 800); }
  }

  const stored = +(localStorage.getItem('faero-simon-best') || 0);
  if (stored) bestEl.textContent = stored;
})();
</script>
</body>
</html>
