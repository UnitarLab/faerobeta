<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — faero</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: linear-gradient(180deg,
      #1a88d4 0%, #3aa8e8 26%, #7cc8f0 48%,
      #b8e6f8 64%, #cfeec0 76%, #8ec86a 88%, #56a34a 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Exo 2',sans-serif; overflow:hidden; user-select:none; touch-action:none;
  }

  .bubble {
    position:fixed; bottom:-70px; border-radius:50%; pointer-events:none; z-index:0;
    background: radial-gradient(circle at 32% 28%,
      rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 22%,
      rgba(190,230,255,0.12) 48%, rgba(140,210,250,0.05) 75%);
    border:1px solid rgba(255,255,255,0.55);
    box-shadow: inset -4px -6px 12px rgba(120,190,240,0.25), 0 0 12px rgba(255,255,255,0.25);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translate(0,0); opacity:0; }
    8%   { opacity:1; }
    50%  { transform: translate(14px,-55vh); }
    100% { transform: translate(-10px,-112vh); opacity:0.9; }
  }

  h1 {
    font-family:'Orbitron',sans-serif; font-size:1.45rem; font-weight:900; letter-spacing:0.34em;
    color:transparent; z-index:1; margin-bottom:0.75rem;
    background:linear-gradient(180deg,#ffffff 20%,#d7f1ff 55%,#8fd0f5 100%);
    -webkit-background-clip:text; background-clip:text;
    filter:drop-shadow(0 2px 3px rgba(10,60,110,0.55)) drop-shadow(0 0 16px rgba(255,255,255,0.5));
  }

  .hud { display:flex; gap:0.7rem; align-items:center; margin-bottom:0.75rem; z-index:1; }
  .panel {
    background: linear-gradient(160deg, rgba(255,255,255,0.82) 0%, rgba(222,243,255,0.55) 100%);
    border:1px solid rgba(255,255,255,0.95);
    border-radius:14px; padding:0.3rem 0.9rem; text-align:center; min-width:76px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: inset 0 1px 0 #ffffff, inset 0 -1px 0 rgba(170,215,245,0.6),
                0 8px 22px rgba(15,80,130,0.28);
  }
  .panel-label { font-size:0.52rem; letter-spacing:0.2em; color:#2a7cb0; text-transform:uppercase; font-weight:700; }
  .panel-value { font-family:'Orbitron',sans-serif; font-size:1.15rem; font-weight:700; color:#0a4d80; text-shadow:0 1px 0 rgba(255,255,255,0.8); }

  .btn {
    font-family:'Exo 2',sans-serif; font-size:0.66rem; font-weight:800;
    letter-spacing:0.14em; text-transform:uppercase; padding:0.55rem 1.15rem;
    border-radius:50px; cursor:pointer; position:relative; transition:all 0.15s;
    color:#fff; text-shadow:0 1px 2px rgba(10,60,110,0.5);
    background:linear-gradient(180deg,#6cc6f2 0%,#1a88d4 55%,#1272b8 100%);
    border:1px solid rgba(255,255,255,0.75);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 12px rgba(15,80,130,0.4);
  }
  .btn::before { content:''; position:absolute; left:8%; right:8%; top:6%; height:42%;
    background:linear-gradient(180deg,rgba(255,255,255,0.75),rgba(255,255,255,0.05));
    border-radius:50px; pointer-events:none; }
  .btn:hover { transform:translateY(-1px); filter:brightness(1.08); }

  .bezel {
    border-radius:22px; padding:10px; z-index:1; position:relative;
    background:linear-gradient(160deg, rgba(255,255,255,0.7) 0%, rgba(205,236,255,0.38) 100%);
    border:1px solid rgba(255,255,255,0.9);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 #fff, 0 18px 44px rgba(12,70,115,0.4);
  }
  canvas { display:block; border-radius:14px; }

  #overlay {
    position:absolute; inset:10px; border-radius:14px; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.6rem;
    background:linear-gradient(160deg, rgba(230,246,255,0.72), rgba(170,220,250,0.6));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.8); text-align:center; padding:1rem;
  }
  #overlay.hide { display:none; }
  #overlayTitle { font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.25rem; color:#0a4d80;
    text-shadow:0 1px 0 rgba(255,255,255,0.9); letter-spacing:0.18em; }
  #overlaySub { font-size:0.72rem; font-weight:600; color:#2a7cb0; letter-spacing:0.08em; max-width:260px; line-height:1.5; }

  .hint { margin-top:0.55rem; z-index:1; font-size:0.62rem; font-weight:600;
    color:rgba(10,70,115,0.6); letter-spacing:0.1em; text-align:center; }
</style>
</head>
<body>
  <div class="bubble" style="left:8%;  width:24px;height:24px; animation-duration:11s;"></div>
  <div class="bubble" style="left:26%; width:14px;height:14px; animation-duration:8s;  animation-delay:-3s;"></div>
  <div class="bubble" style="left:48%; width:32px;height:32px; animation-duration:13s; animation-delay:-6s;"></div>
  <div class="bubble" style="left:68%; width:16px;height:16px; animation-duration:9s;  animation-delay:-1s;"></div>
  <div class="bubble" style="left:86%; width:38px;height:38px; animation-duration:14s; animation-delay:-8s;"></div>

  <h1>SNAKE</h1>

  <div class="hud">
    <div class="panel"><div class="panel-label">Score</div><div class="panel-value" id="score">0</div></div>
    <div class="panel"><div class="panel-label">Best</div><div class="panel-value" id="best">0</div></div>
    <button class="btn" onclick="reset()">&#8635;</button>
  </div>

  <div class="bezel">
    <canvas id="cv" width="396" height="396"></canvas>
    <div id="overlay">
      <div id="overlayTitle">READY</div>
      <div id="overlaySub">Arrows / WASD to steer &middot; eat bubbles, don't bite yourself.<br>On touch: swipe anywhere.</div>
      <button class="btn" onclick="startGame()">Play</button>
    </div>
  </div>

  <div class="hint">arrows / wasd / swipe</div>

<script>
(() => {
  const COLS = 18, ROWS = 18, CELL = 22;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');

  let snake, dir, nextDir, food, score, best, speed, tickTimer, running = false;

  best = +(localStorage.getItem('faero-snake-best') || 0);
  bestEl.textContent = best;

  function reset() {
    stopLoop();
    snake = [{x:8,y:9},{x:7,y:9},{x:6,y:9}];
    dir = {x:1,y:0}; nextDir = dir;
    score = 0; speed = 150; running = false;
    scoreEl.textContent = '0';
    placeFood();
    draw();
    overlayTitle.textContent = 'READY';
    overlaySub.innerHTML = "Arrows / WASD to steer &middot; eat bubbles, don't bite yourself.<br>On touch: swipe anywhere.";
    overlay.classList.remove('hide');
  }

  function startGame() {
    if (running) return;
    overlay.classList.add('hide');
    running = true;
    loop();
  }

  const stopLoop = () => clearInterval(tickTimer);

  function loop() {
    stopLoop();
    tickTimer = setInterval(() => { step(); draw(); }, speed);
  }

  function placeFood() {
    do { food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function setDir(x, y) {
    // no instant 180° turns
    if (snake && snake.length > 1 && x === -dir.x && y === -dir.y) return;
    nextDir = {x, y};
  }

  function step() {
    dir = nextDir;
    const head = { x: (snake[0].x + dir.x + COLS) % COLS, y: (snake[0].y + dir.y + ROWS) % ROWS };

    if (snake.some((s, i) => i > 0 && s.x === head.x && s.y === head.y)) return die();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      popFood();
      if (score % 50 === 0 && speed > 70) { speed -= 8; loop(); }   // faster every 5 bubbles
      if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('faero-snake-best', best); }
    } else {
      snake.pop();
    }
  }

  function die() {
    running = false;
    stopLoop();
    flashHead();
    overlayTitle.textContent = 'GAME OVER';
    overlaySub.innerHTML = 'Score: <b>' + score + '</b>' + (score >= best ? ' &mdash; new best!' : ' &middot; best: ' + best);
    overlay.querySelector('.btn').textContent = 'Again';
    overlay.classList.remove('hide');
  }

  let flash = 0;
  function flashHead() { flash = 6; draw(); }

  function popFood() { /* small scale pulse handled in draw via timestamp */ foodPulse = Date.now(); }
  let foodPulse = 0;

  /* ── rendering ─────────────────────────────────────────── */
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  }

  function draw() {
    // pond water
    const g = ctx.createLinearGradient(0, 0, 0, cv.height);
    g.addColorStop(0, '#bfe9ff'); g.addColorStop(0.55, '#8fd4f2'); g.addColorStop(1, '#63b8dd');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);

    // soft caustic light patches
    for (let i = 0; i < 5; i++) {
      const cx = 40 + i * 82, cy = 60 + ((i * 97) % 280);
      const rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 46);
      rg.addColorStop(0, 'rgba(255,255,255,0.35)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg; ctx.fillRect(cx - 46, cy - 46, 92, 92);
    }

    // grid hint
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, cv.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(cv.width, i*CELL); ctx.stroke();
    }

    // food bubble
    const px = food.x*CELL, py = food.y*CELL;
    const pulse = foodPulse ? 1 + Math.max(0, 160 - (Date.now()-foodPulse)) / 160 * 0.35 : 1;
    const fr = CELL*0.36*pulse;
    const fgx = px+CELL/2, fgy = py+CELL/2;
    const fbub = ctx.createRadialGradient(fgx-fr*0.35, fgy-fr*0.4, 1, fgx, fgy, fr);
    fbub.addColorStop(0,'rgba(255,255,255,0.95)'); fbub.addColorStop(0.45,'rgba(200,240,255,0.5)');
    fbub.addColorStop(1,'rgba(120,200,245,0.28)');
    ctx.fillStyle = fbub;
    ctx.beginPath(); ctx.arc(fgx, fgy, fr, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(fgx, fgy, fr, 0, 7); ctx.stroke();

    // snake — glossy segments
    snake.forEach((s, i) => {
      const x = s.x*CELL, y = s.y*CELL, head = i === 0;
      const t = i / snake.length;
      const sg = ctx.createLinearGradient(x, y, x, y+CELL);
      sg.addColorStop(0, mix('#aef2c0', '#5cc98a', t));
      sg.addColorStop(1, mix('#2ea05f', '#177a45', t));
      ctx.fillStyle = sg;
      rr(x+1, y+1, CELL-2, CELL-2, 6); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + (head?0.85:0.4*(1-t)+0.15) + ')';
      rr(x+3.5, y+3, CELL-7, 4, 2); ctx.fill();     // gloss strip
      if (flash > 0 && head) { ctx.fillStyle = 'rgba(255,90,60,'+(flash/8)+')'; rr(x+1,y+1,CELL-2,CELL-2,6); ctx.fill(); }
    });
    if (flash > 0) { flash--; requestAnimationFrame(draw); }

    // eyes on head
    if (snake.length) {
      const hx = snake[0].x*CELL+CELL/2, hy = snake[0].y*CELL+CELL/2;
      ctx.fillStyle = '#06321c';
      const ex = dir.y !== 0 ? 4.5 : 3, ey = dir.x !== 0 ? 4.5 : 3;
      ctx.beginPath(); ctx.arc(hx - ex, hy - ey, 1.8, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(hx + ex, hy + ey, 1.8, 0, 7); ctx.fill();
    }
  }

  function mix(a, b, t) {
    const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
    const r = Math.round(((pa>>16)&255)*(1-t) + ((pb>>16)&255)*t);
    const g = Math.round(((pa>>8)&255)*(1-t) + ((pb>>8)&255)*t);
    const bl= Math.round((pa&255)*(1-t) + (pb&255)*t);
    return `rgb(${r},${g},${bl})`;
  }

  /* ── input ─────────────────────────────────────────────── */
  const KEYS = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0]
  };
  addEventListener('keydown', e => {
    const k = KEYS[e.key] || KEYS[e.key.toLowerCase()];
    if (k) {
      e.preventDefault();
      if (!running && !overlay.classList.contains('hide')) startGame();
      setDir(k[0], k[1]);
    }
  });

  let tx0, ty0;
  cv.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, {passive:true});
  cv.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (!running) startGame();
    Math.abs(dx) > Math.abs(dy) ? setDir(Math.sign(dx), 0) : setDir(0, Math.sign(dy));
  });

  reset();
})();
</script>
</body>
</html>
