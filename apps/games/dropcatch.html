<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drop Catch — faero</title>
<link rel="stylesheet" href="aero.css">
<style>
  canvas { display:block; border-radius:14px; cursor:none; }
  .bezel { cursor:none; }
</style>
</head>
<body class="faero">
<script src="aero.js"></script>
<h1>DROP CATCH</h1>
<div class="hud">
  <div class="panel"><div class="panel-label">Score</div><div class="panel-value" id="score">0</div></div>
  <div class="panel"><div class="panel-label">Missed</div><div class="panel-value" id="miss">0/3</div></div>
  <button class="btn" onclick="start()">Start</button>
</div>
<div class="bezel"><canvas id="cv" width="420" height="380"></canvas>
  <div id="overlay"><div id="overlayTitle">READY</div><div id="overlaySub">Move the glass pane with the mouse.<br>Catch drops &mdash; miss three and it's over.</div><button class="btn" onclick="start()">Play</button></div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, PW = 84, PH = 16;
  let px, drops, score, missed, running, speed, raf, spawnIn;

  function start() {
    cancelAnimationFrame(raf);
    px = W/2 - PW/2; drops = []; score = 0; missed = 0; speed = 2.6; spawnIn = 30;
    sync();
    document.getElementById('overlay').classList.add('hide');
    loop();
  }

  function sync() {
    document.getElementById('score').textContent = score;
    document.getElementById('miss').textContent = missed + '/3';
  }

  function end() {
    running = false;
    const ov = document.getElementById('overlay');
    document.getElementById('overlayTitle').textContent = 'SPILLED';
    document.getElementById('overlaySub').innerHTML = 'Caught: <b>' + score + '</b> drops';
    ov.querySelector('.btn').textContent = 'Again';
    ov.classList.remove('hide');
  }

  function loop() {
    step(); draw();
    if (running) raf = requestAnimationFrame(loop);
  }

  function step() {
    speed += 0.0018;
    if (--spawnIn <= 0) {
      drops.push({ x: 20 + Math.random()*(W-40), y: -12, v: speed*(0.85+Math.random()*0.5), bad: Math.random() < 0.18 });
      spawnIn = Math.max(14, 34 - score*0.4);
    }
    for (let i = drops.length-1; i >= 0; i--) {
      const d = drops[i];
      d.y += d.v;
      const caught = d.y > H-PH-26 && d.y < H-14 && d.x > px && d.x < px+PW;
      if (caught) {
        drops.splice(i,1);
        splash(d.x, H-PH-24);
        if (d.bad) { missed++; sync(); shake(); if (missed >= 3) { end(); return; } }
        else { score++; sync(); }
        continue;
      }
      if (d.y > H) {
        drops.splice(i,1);
        if (!d.bad) { missed++; sync(); if (missed >= 3) { end(); return; } }
      }
    }
  }

  let shakeT = 0;
  function shake() { shakeT = 6; }

  const splashes = [];
  function splash(x, y) { splashes.push({x, y, t: 1}); }

  function draw() {
    ctx.save();
    if (shakeT > 0) { ctx.translate((Math.random()-0.5)*6, (Math.random()-0.5)*4); shakeT--; }

    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#bfe9ff'); g.addColorStop(1,'#63b8dd');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    for (const s of splashes) {
      s.t -= 0.05;
      if (s.t <= 0) continue;
      ctx.strokeStyle = `rgba(255,255,255,${s.t})`;
      ctx.lineWidth = 2;
      for (const a of [-0.7, -0.35, 0.35, 0.7]) {
        ctx.beginPath(); ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + Math.sin(a)*10*(1-s.t+0.3), s.y - Math.cos(a)*12*(1-s.t+0.3));
        ctx.stroke();
      }
    }

    for (const d of drops) dropShape(d);

    const pg = ctx.createLinearGradient(0,H-PH-10,0,H);
    pg.addColorStop(0,'rgba(255,255,255,0.95)');
    pg.addColorStop(1,'rgba(120,200,245,0.65)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.roundRect(px, H-PH-10, PW, PH+10, [10,10,14,14]); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
    ctx.restore();
  }

  function dropShape(d) {
    ctx.save();
    ctx.translate(d.x, d.y);
    if (!d.bad) ctx.rotate(Math.PI);
    const g2 = ctx.createRadialGradient(-2,-3,1,0,0,9);
    g2.addColorStop(0, 'rgba(255,255,255,0.95)');
    g2.addColorStop(d.bad ? 0.4 : 0.5, d.bad ? '#ef5340' : '#59b8f0');
    g2.addColorStop(1, d.bad ? 'rgba(176,42,26,0.75)' : 'rgba(40,120,190,0.55)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.moveTo(0,-11);
    ctx.quadraticCurveTo(8,-2, 8,3);
    ctx.arc(0,3,8,0,Math.PI);
    ctx.quadraticCurveTo(-8,-2, 0,-11);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.stroke();
    ctx.restore();
  }

  const move = clientX => {
    const rect = cv.getBoundingClientRect();
    px = Math.max(0, Math.min(W-PW, (clientX-rect.left)*(W/rect.width) - PW/2));
  };
  cv.addEventListener('mousemove', e => move(e.clientX));
  cv.addEventListener('touchmove', e => { e.preventDefault(); move(e.touches[0].clientX); }, {passive:false});

  start();
})();
</script>
</body>
</html>
