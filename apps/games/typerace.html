<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type Race — faero</title>
<link rel="stylesheet" href="aero.css">
<style>
  #quote {
    width:420px; max-width:88vw; z-index:1; padding:1rem 1.2rem; border-radius:16px;
    font-size:1.02rem; line-height:1.7;
    background:linear-gradient(160deg, rgba(255,255,255,0.85), rgba(222,243,255,0.6));
    border:1px solid rgba(255,255,255,0.95);
    box-shadow: inset 0 1px 0 #fff, 0 8px 22px rgba(15,80,130,0.28);
    color:#0a4d80;
  }
  #quote span.done { color:#1e9e50; }
  #quote span.err { color:#d0342c; text-decoration:underline; }
  #quote span.cur { background:rgba(120,200,245,0.55); border-radius:3px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { background:rgba(120,200,245,0.15); } }
  #inp {
    margin-top:0.9rem; z-index:1; width:420px; max-width:88vw;
    padding:0.65rem 0.9rem; border-radius:12px; border:1px solid rgba(255,255,255,0.9);
    font-family:'Exo 2',sans-serif; font-size:1rem; outline:none;
    background:rgba(255,255,255,0.6); color:#0a4d80;
    box-shadow: inset 0 2px 5px rgba(20,90,140,0.15);
  }
</style>
</head>
<body class="faero">
<script src="aero.js"></script>
<h1>TYPE RACE</h1>
<div class="hud">
  <div class="panel"><div class="panel-label">WPM</div><div class="panel-value" id="wpm">0</div></div>
  <div class="panel"><div class="panel-label">Accuracy</div><div class="panel-value" id="acc">100%</div></div>
  <div class="panel"><div class="panel-label">Best</div><div class="panel-value" id="best">&ndash;</div></div>
</div>
<div id="quote"></div>
<input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="start typing&hellip;">
<div id="msg" class="gmsg">type the sentence above</div>

<script>
(() => {
  const SENTENCES = [
    'the glass windows float above a sea of green bubbles',
    'water drops race down the screen in the summer sun',
    'an old desktop hums softly under a blue gradient sky',
    'bubbles drift upward while the taskbar glows aqua',
    'frutiger aero promised us a shiny clean future',
    'the internet felt like a garden once upon a time'
  ];
  const quoteEl = document.getElementById('quote');
  const inp = document.getElementById('inp');
  const msg = document.getElementById('msg');
  const wpmEl = document.getElementById('wpm'), accEl = document.getElementById('acc'), bestEl = document.getElementById('best');
  let target = '', started = 0, done = false;

  const stored = +(localStorage.getItem('faero-type-best') || 0);
  if (stored) bestEl.textContent = stored;

  function load() {
    target = SENTENCES[Math.floor(Math.random()*SENTENCES.length)];
    done = false;
    inp.value = ''; inp.disabled = false;
    wpmEl.textContent = '0'; accEl.textContent = '100%';
    msg.textContent = 'type the sentence above';
    render();
    setTimeout(() => inp.focus(), 50);
  }

  function render(pos = 0, bad = false) {
    quoteEl.innerHTML =
      '<span class="done">' + escapeHtml(target.slice(0, pos)) + '</span>' +
      '<span class="' + (bad ? 'err' : 'cur') + '">' + escapeHtml(target[pos] || '') + '</span>' +
      escapeHtml(target.slice(pos + 1));
  }

  const escapeHtml = s => s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

  inp.addEventListener('input', () => {
    if (done) return;
    if (!started) started = performance.now();
    const v = inp.value;
    let ok = 0;
    for (let i = 0; i < v.length; i++) if (v[i] === target[i]) ok++;
    accEl.textContent = Math.round(ok / Math.max(v.length,1) * 100) + '%';

    if (v.length && !target.startsWith(v)) {
      render(v.length - 1, true);
      return;
    }
    render(v.length);

    if (v === target) finish();
    else {
      const mins = (performance.now() - started) / 60000;
      wpmEl.textContent = mins > 0 ? Math.round((v.length/5) / mins) : 0;
    }
  });

  function finish() {
    done = true; inp.disabled = true;
    const secs = (performance.now() - started) / 1000;
    const wpm = Math.round((target.length/5) / (secs/60));
    const acc = parseInt(accEl.textContent);
    wpmEl.textContent = wpm;
    const score = Math.max(1, Math.round(wpm * acc / 100));
    msg.textContent = 'done in ' + secs.toFixed(1) + 's \u2014 score ' + score;
    const best = +(localStorage.getItem('faero-type-best') || 0);
    if (score > best) { localStorage.setItem('faero-type-best', score); bestEl.textContent = score; msg.textContent += ' \u2014 new best!'; }
    setTimeout(load, 2200);
  }

  load();
})();
</script>
</body>
</html>
